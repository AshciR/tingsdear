services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: tingsdear-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tingsdear
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tingsdear']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
